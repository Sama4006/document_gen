# Used by Vercel to install dependencies and find the app.
# For local use, install backend/requirements.txt instead (it adds ChromaDB,
# the local knowledge-base store; on Vercel, Upstash Vector replaces it).
[project]
name = "document-gen"
version = "2.1.0"
description = "AI-powered Word document generation with RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "openai>=1.40",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
